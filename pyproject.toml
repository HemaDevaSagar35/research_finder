[project]
name = "research-finder"
version = "0.1.0"
description = "Tools for finding and downloading research papers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.60",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "openreview-py>=1.40",
    "playwright>=1.45",
    "pydantic>=2.13.4",
    "faiss-cpu<1.10",
    "bm25s>=0.3.11",
    "numpy>=2.2.6",
    "fastembed>=0.7.4",
    "onnxruntime<1.22",
]
